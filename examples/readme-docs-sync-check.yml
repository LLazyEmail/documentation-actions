name: README docs sync check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'website/docs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-readme-sync.yml@v1
    with:
      docs-glob: website/docs/**/*.md
