# Single source of truth for this repo's reusable-workflow layout (DA #181, option a).
#
# Edit this file, then run:  python3 scripts/gen-workflows.py
# CI runs `python3 scripts/gen-workflows.py --check` and fails when a generated file
# is out of date or a hand-written workflow no longer matches its entry here.
#
# aliases:   generated. Each short-name file copies the `workflow_call` block (inputs,
#             secrets) of `long` verbatim and forwards everything to `calls` (default:
#             `long`). `job` is the job id callers see in check names, so never
#             rename it. `permissions` is the alias's top-level block (omit for none).
#             `secrets`: inherit | forward (the default when `long` declares secrets).
# workflows: hand-written for now and checked against this list: job ids and
#             check names, permissions, secrets, which of this repo's actions
#             they call (inputs must exist on the action), and inputs that are
#             declared but not used (`unused-inputs`, kept so they stay visible).
#             Own refs stay `@main`. scripts/pin-release-refs.sh pins them at release.
#             Optional `inputs-from-action: <action>` + `inputs:` generates the
#             workflow's `workflow_call.inputs` block: `<name>: <type>` takes the
#             description, required and default from actions/<action>/action.yml;
#             `<name>: keep` keeps the workflow's own definition (workflow-only input).
#             Every action input must be in `inputs:` or `not-exposed:`, so a new
#             action input can't be forgotten. Typed inputs are also forwarded
#             (`<name>: ${{ inputs.<name> }}`) in the action step's `with:` block,
#             between `# generated:` / `# end generated`. Hand lines below the block
#             (value conversions, secrets) win. Other steps stay hand-written.

version: 1

aliases:
  - short: reusable-pages-deploy
    long: reusable-docusaurus-pages-deploy
    name: Reusable pages deploy (short name)
    comment: |
      Short-name alias. Prefer this over reusable-docusaurus-pages-deploy.yml.
      Both names call the same implementation.
    job: deploy
    permissions: {contents: write, pages: write, id-token: write}
    secrets: inherit
  - short: reusable-test-deploy
    long: reusable-docusaurus-test-deploy
    calls: reusable-docs-ci
    name: Reusable test-deploy (short name)
    comment: |
      Short-name alias for reusable-docusaurus-test-deploy.yml.
      Same inputs and behavior: both call reusable-docs-ci.yml with run-build: true.
      Prefer this name in new callers.
    job: test-deploy
    permissions: {contents: read, pull-requests: write, issues: write}
    with-fixed: {run-build: true}
  - short: reusable-readme-sync
    long: reusable-readme-docs-sync-check
    name: Reusable README sync (short name)
    comment: |
      Short-name alias. Prefer this over reusable-readme-docs-sync-check.yml.
    job: check
    permissions: {contents: read, pull-requests: write}
  - short: reusable-readme-only
    long: reusable-comment-readme-only
    name: Reusable README-only comment (short name)
    comment: |
      Short-name alias for reusable-comment-readme-only.yml.
    job: comment
    permissions: {contents: read, pull-requests: write}
  - short: reusable-label-conflicts
    long: reusable-label-conflicted-prs
    name: Reusable label conflicts (short name)
    comment: |
      Short-name alias for reusable-label-conflicted-prs.yml.
    job: label
    permissions: {contents: read, pull-requests: write}
  - short: reusable-pr-report
    long: reusable-pr-status-report
    name: Reusable PR report (short name)
    comment: |
      Short-name alias for reusable-pr-status-report.yml.
    job: report
    permissions: {contents: read, issues: write, pull-requests: read}
  - short: reusable-thin-content
    long: reusable-thin-content-check
    name: Reusable thin content (short name)
    comment: |
      Short-name alias for reusable-thin-content-check.yml.
    job: thin-content
    permissions: {contents: read}
  - short: reusable-image-check
    long: reusable-build-image-check
    name: Reusable image check (short name)
    comment: |
      Short-name alias for reusable-build-image-check.yml.
    job: images
    permissions: {contents: read}
  - short: reusable-entry-format
    long: reusable-awesome-entry-format-check
    name: Reusable entry format (short name)
    comment: |
      Short-name alias for reusable-awesome-entry-format-check.yml.
    job: validate
    permissions: {contents: read}
  - short: reusable-npm-check
    long: reusable-npm-script-check
    name: Reusable npm check (short name)
    comment: |
      Short-name alias for reusable-npm-script-check.yml: same inputs and secrets, passed through unchanged.
      Note: check names gain one level (<caller job> / call / <job>) compared with calling the long name.
    job: call
  - short: reusable-auto-rebase
    long: reusable-auto-rebase-prs
    name: Reusable auto-rebase (short name)
    comment: |
      Short-name alias for reusable-auto-rebase-prs.yml: same inputs and secrets, passed through unchanged.
      Note: check names gain one level (<caller job> / call / <job>) compared with calling the long name.
    job: call
    permissions: {contents: write, pull-requests: write}
  - short: reusable-close-superseded
    long: reusable-close-superseded-prs
    name: Reusable close superseded PRs (short name)
    comment: |
      Short-name alias for reusable-close-superseded-prs.yml: same inputs and secrets, passed through unchanged.
      Note: check names gain one level (<caller job> / call / <job>) compared with calling the long name.
    job: call
    permissions: {pull-requests: write}
  - short: reusable-awesome-checks
    long: reusable-awesome-list-checks
    name: Reusable awesome-list checks (short name)
    comment: |
      Short-name alias for reusable-awesome-list-checks.yml: same inputs and secrets, passed through unchanged.
      Note: check names gain one level (<caller job> / call / <job>) compared with calling the long name.
    job: call

workflows:
  - file: reusable-auto-rebase-prs
    jobs: {rebase: auto-rebase}
    permissions: {contents: write, pull-requests: write}
    secrets: [AUTO_REBASE_TOKEN]
    actions: [auto-rebase]
    inputs-from-action: auto-rebase
    inputs:
      pr-numbers: string
      rebase-conflicts: boolean
      report-conflicts: boolean
      comment-on-update: boolean
      merge-fallback: boolean
      supersede-fork-prs: boolean
      supersede-union-paths: string
      supersede-draft: boolean
      supersede-sync-message: string
      resolve-deleted-on-main: boolean
      resolve-deleted-paths: string
      fail-on-conflict: boolean
      conflict-label: string
      delegate-bot-rebase: boolean
    not-exposed: [github-token, success-message, fork-blocked-message]
  - file: reusable-awesome-entry-format-check
    jobs: {validate: null}
    permissions: {contents: read}
  - file: reusable-awesome-list-checks
    jobs: {awesome-checks: awesome-list-checks}
    actions: [awesome-list-checks]
    inputs-from-action: awesome-list-checks
    inputs:
      readme-path: string
      checks: string
      duplicate-mode: string
      sorted-mode: string
      entry-format-mode: string
      node-version: keep
  - file: reusable-build-image-check
    jobs: {images: null}
    permissions: {contents: read}
    actions: [build-image-check, docusaurus-build]
  - file: reusable-catalog-api
    jobs: {catalog-api: Regenerate catalog JSON}
    permissions: {contents: write}
    actions: [git-push-retry]
  - file: reusable-changelog
    jobs: {changelog: Regenerate changelog}
    permissions: {contents: write}
    actions: [git-push-retry]
  - file: reusable-close-superseded-prs
    jobs: {close: close-superseded}
    permissions: {pull-requests: write}
    actions: [close-superseded]
    inputs-from-action: close-superseded
    inputs:
      comment: string
    not-exposed: [github-token]
  - file: reusable-comment-readme-only
    jobs: {comment: null}
    permissions: {contents: read, pull-requests: write}
  - file: reusable-docs-ci
    jobs: {markdownlint: markdownlint, lychee: lychee, npm-check: '${{ inputs.npm-check-job-name }}', build: Test build}
    permissions: {contents: read, pull-requests: write, issues: write}
    actions: [docusaurus-build, docusaurus-pr-comment, lychee-link-check, markdownlint, npm-script-check]
  - file: reusable-docs-index
    jobs: {docs-index: Regenerate docs pages index}
    permissions: {contents: write}
    actions: [git-push-retry]
  - file: reusable-docs-suite
    jobs: {docs-ci: null, pages-deploy: null, readme-sync: null, label-conflicts: null}
    permissions: {contents: write, pages: write, id-token: write, pull-requests: write, issues: write}
  - file: reusable-docusaurus-pages-deploy
    jobs: {build: Build Docusaurus, deploy: Deploy to GitHub Pages, deploy-peaceiris: Deploy via peaceiris}
    permissions: {contents: write, pages: write, id-token: write}
    actions: [docusaurus-build]
    inputs-from-action: docusaurus-build
    inputs:
      working-directory: string
      node-version: string
      cache-dependency-path: string
      install-command: string
      build-command: string
      artifact-path: keep
      peaceiris-publish-dir: keep
      peaceiris-cname: keep
      lfs: keep
    not-exposed: [prebuild-command, package-manager-cache, annotate-log]
  - file: reusable-docusaurus-test-deploy
    jobs: {test-deploy: null}
    permissions: {contents: read, pull-requests: write, issues: write}
  - file: reusable-label-conflicted-prs
    jobs: {label: null}
    permissions: {contents: read, pull-requests: write}
  - file: reusable-link-check
    jobs: {lychee: lychee}
    actions: [lychee-link-check]
    inputs-from-action: lychee-link-check
    inputs:
      args: string
      create-issue: boolean
      docusaurus-root: string
      config-file: string
      issue-title: string
      update-existing-issue: boolean
    not-exposed: [fail, output, issue-labels, github-token]
  - file: reusable-markdownlint
    jobs: {markdownlint: markdownlint}
    actions: [markdownlint]
    inputs-from-action: markdownlint
    inputs:
      globs: string
  - file: reusable-npm-script-check
    jobs: {npm-script-check: '${{ inputs.job-name }}'}
    actions: [npm-script-check]
    inputs-from-action: npm-script-check
    inputs:
      working-directory: string
      node-version: string
      cache-dependency-path: string
      install-command: string
      package-manager-cache: string
      run-command: string
      fetch-depth: keep
      lfs: keep
      job-name: keep
  - file: reusable-pr-status-report
    jobs: {report: null}
    permissions: {contents: read, issues: write, pull-requests: read}
  - file: reusable-readme-docs-sync-check
    jobs: {check-sync: null}
    permissions: {contents: read, pull-requests: write}
  - file: reusable-star-request
    jobs: {comment: star-request}
    permissions: {pull-requests: write}
    actions: [star-request]
    inputs-from-action: star-request
    inputs:
      message: string
    not-exposed: [github-token]
  - file: reusable-sync-feedback
    jobs: {feedback: docs-sync-feedback}
    permissions: {contents: read, issues: write, pull-requests: write}
    actions: [docs-sync-feedback]
    inputs-from-action: docs-sync-feedback
    inputs:
      docs-glob: string
      pass-if-links-in-docs: boolean
      label: string
      contributing-url: string
      check-name: string
      pr-number: string
    not-exposed: [github-token]
  - file: reusable-thin-content-check
    jobs: {thin-content: null}
    permissions: {contents: read}
    actions: [docusaurus-build, thin-content-check]
