name: Docusaurus build
description: >
  Install dependencies and build a Docusaurus site. Optional pre-build script
  (for example lint:docs-links). Tees the build log and surfaces broken-link /
  warning / error lines as GitHub annotations and a job summary. Does not deploy.

branding:
  icon: package
  color: gray-dark

inputs:
  working-directory:
    description: Directory that contains package.json (website or .)
    required: false
    default: website
  node-version:
    description: Node.js version (override; default 22)
    required: false
    default: '22'
  cache-dependency-path:
    description: Lockfile path for setup-node cache
    required: false
    default: website/package-lock.json
  install-command:
    description: Install command
    required: false
    default: npm ci
  build-command:
    description: Build command
    required: false
    default: npm run build
  prebuild-command:
    description: Optional command before build (empty skips)
    required: false
    default: ''
  package-manager-cache:
    description: setup-node cache value (npm, yarn, pnpm) or empty to disable
    required: false
    default: npm
  annotate-log:
    description: Tee build output and emit annotations + job summary
    required: false
    default: 'true'

outputs:
  warning-count:
    description: Number of warning-like lines matched in the build log
    value: ${{ steps.annotate.outputs.warning-count }}
  error-count:
    description: Number of error-like lines matched in the build log
    value: ${{ steps.annotate.outputs.error-count }}
  build-log-path:
    description: Path to the teed build log (empty when annotate-log is false)
    value: ${{ steps.annotate.outputs.build-log-path }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager-cache != '' && inputs.package-manager-cache || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}

    - name: Pre-build
      if: inputs.prebuild-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.prebuild-command }}

    - name: Build website
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANNOTATE_LOG: ${{ inputs.annotate-log }}
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        set -euo pipefail
        if [[ "${ANNOTATE_LOG}" != "true" ]]; then
          eval "${BUILD_COMMAND}"
          exit 0
        fi
        log="${RUNNER_TEMP}/docusaurus-build.log"
        set +e
        set -o pipefail
        eval "${BUILD_COMMAND}" 2>&1 | tee "${log}"
        status=${PIPESTATUS[0]}
        set -e
        echo "build-log-path=${log}" >>"${GITHUB_OUTPUT}"
        exit "${status}"

    - name: Annotate build log
      id: annotate
      if: always() && inputs.annotate-log == 'true'
      shell: bash
      env:
        LOG_PATH: ${{ steps.build.outputs.build-log-path }}
      run: |
        set -euo pipefail
        log="${LOG_PATH:-${RUNNER_TEMP}/docusaurus-build.log}"
        echo "build-log-path=${log}" >>"${GITHUB_OUTPUT}"
        bash "${{ github.action_path }}/scripts/annotate-build-log.sh" "${log}"
