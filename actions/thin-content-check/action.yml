name: Thin content check
description: Report built Docusaurus pages with little main content, with a job summary checklist and optional JSON report.
inputs:
  build-dir:
    description: Built site directory relative to the workspace
    default: build
  base-url:
    description: Site URL path prefix (for example /docs/)
    default: /
  site-url:
    description: Optional site origin (for example https://example.github.io) for full page URLs
    default: ''
  min-words:
    description: Pages with fewer visible words in the main content are reported
    default: '150'
  allowlist:
    description: Optional workspace-relative allowlist (page path, URL path, route or source file per line)
    default: ''
  mode:
    description: warn or fail (configuration errors always fail)
    default: warn
  report-json:
    description: Optional workspace-relative path for the JSON report
    default: ''
  docusaurus-dir:
    description: Optional .docusaurus directory used to map pages to source files
    default: ''
runs:
  using: composite
  steps:
    - name: Check page content
      shell: bash
      env:
        CHECKER: ${{ github.action_path }}/scripts/check-thin-content.mjs
        BUILD_DIR: ${{ inputs.build-dir }}
        BASE_URL: ${{ inputs.base-url }}
        SITE_URL: ${{ inputs.site-url }}
        MIN_WORDS: ${{ inputs.min-words }}
        ALLOWLIST: ${{ inputs.allowlist }}
        MODE: ${{ inputs.mode }}
        REPORT_JSON: ${{ inputs.report-json }}
        DOCUSAURUS_DIR: ${{ inputs.docusaurus-dir }}
      run: |
        node "$CHECKER" --build-dir "$BUILD_DIR" --base-url "$BASE_URL" \
          --site-url "$SITE_URL" --min-words "$MIN_WORDS" \
          --allowlist "$ALLOWLIST" --mode "$MODE" --report-json "$REPORT_JSON" \
          --docusaurus-dir "$DOCUSAURUS_DIR"
