name: Close superseded PRs
description: 'When a merged PR body says "Supersedes #N", close PR #N with a thank-you comment.'
inputs:
  github-token:
    description: Token with pull-requests write access
    default: ${{ github.token }}
  comment:
    description: 'Comment posted before closing; {merged} is the merged PR number, {author} the closed PR author'
    default: 'Closed in favour of #{merged}, which superseded this PR and has been merged. Thank you for the contribution, @{author}!'
runs:
  using: composite
  steps:
    - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLOSE_COMMENT: ${{ inputs.comment }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {run} = require(`${process.env.ACTION_PATH}/close.js`);
          await run({github, context, core, comment: process.env.CLOSE_COMMENT});
