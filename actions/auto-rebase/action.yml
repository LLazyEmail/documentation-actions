name: Auto-rebase open PRs
description: Update selected PR branches, with optional conflict rebase.
inputs:
  github-token:
    description: Token with write access to target branches
    default: ${{ github.token }}
  success-message:
    description: Comment after a successful branch update
    default: '✅ Automatically updated this PR branch with the latest changes from main.'
  fork-blocked-message:
    description: Guidance when fork permissions block updates
    default: 'Enable Allow edits from maintainers or update the fork branch yourself.'
  pr-numbers:
    description: Comma-separated PR numbers; empty selects all open PRs
    default: ''
  rebase-conflicts:
    description: Opt in to git rebase and force-push with lease
    default: 'false'
  report-conflicts:
    description: Without rebase-conflicts, comment conflicting files once per head SHA instead of failing
    default: 'false'
  comment-on-update:
    description: Comment on PRs after a successful branch update
    default: 'true'
  merge-fallback:
    description: With rebase-conflicts, merge-update (no force-push) when the rebase conflicts but GitHub says mergeable
    default: 'false'
  supersede-fork-prs:
    description: >-
      Opt in. For fork PRs that conflict or cannot be updated, replay their commits into
      supersede/pr-N in this repo and open a PR whose body starts with "Supersedes #N".
      Never pushes to the fork.
    default: 'false'
  supersede-union-paths:
    description: >-
      Space/comma-separated globs (e.g. README.md website/docs/**/*.md) where an
      addition-only conflict is resolved by keeping both sides
    default: ''
  supersede-draft:
    description: Open supersede PRs as drafts
    default: 'true'
  supersede-sync-message:
    description: >-
      With supersede-fork-prs, thank-you comment posted on the contributor's PR (once per
      head SHA) when their new or rewritten commits are synced into the supersede PR.
      Placeholders: {author}, {sha}, {supersede}, {number}. Empty uses the default.
    default: >-
      Thanks for the update @{author}! Your updated branch ({sha}) was synced into #{supersede},
      and you're still credited as co-author. Nothing to do on your side; this PR will be closed
      when #{supersede} merges.
  resolve-deleted-on-main:
    description: >-
      Opt in. During rebase-conflicts (and merge-fallback) accept deletions made on the base
      branch for files the PR only modified, if every conflict is of that kind and matches
      resolve-deleted-paths. Dropped files are listed in a PR comment. With merge-fallback,
      also try a local merge when GitHub says the PR is not mergeable.
    default: 'false'
  resolve-deleted-paths:
    description: Space/comma-separated globs where resolve-deleted-on-main may drop files
    default: '.github/workflows/**'
  fail-on-conflict:
    description: Fail the job on unresolvable conflicts (false logs a warning; the PR still gets the conflict report)
    default: 'true'
  conflict-label:
    description: Label added to PRs with unresolvable conflicts and removed after an update (e.g. has-conflicts); empty disables
    default: ''
  delegate-bot-rebase:
    description: >-
      Opt in. For Renovate and Dependabot PRs that are behind or conflicting, ask the bot
      to rebase (tick Renovate's rebase checkbox / comment "@dependabot rebase") instead of
      updating the branch; reported as delegated, never as a failure.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBERS: ${{ inputs.pr-numbers }}
        REBASE_CONFLICTS: ${{ inputs.rebase-conflicts }}
        SUCCESS_MESSAGE: ${{ inputs.success-message }}
        FORK_BLOCKED_MESSAGE: ${{ inputs.fork-blocked-message }}
        REPORT_CONFLICTS: ${{ inputs.report-conflicts }}
        COMMENT_ON_UPDATE: ${{ inputs.comment-on-update }}
        MERGE_FALLBACK: ${{ inputs.merge-fallback }}
        REBASE_TOKEN: ${{ inputs.github-token }}
        SUPERSEDE_FORK_PRS: ${{ inputs.supersede-fork-prs }}
        SUPERSEDE_UNION_PATHS: ${{ inputs.supersede-union-paths }}
        SUPERSEDE_DRAFT: ${{ inputs.supersede-draft }}
        SUPERSEDE_SYNC_MESSAGE: ${{ inputs.supersede-sync-message }}
        DELEGATE_BOT_REBASE: ${{ inputs.delegate-bot-rebase }}
        RESOLVE_DELETED_ON_MAIN: ${{ inputs.resolve-deleted-on-main }}
        RESOLVE_DELETED_PATHS: ${{ inputs.resolve-deleted-paths }}
        FAIL_ON_CONFLICT: ${{ inputs.fail-on-conflict }}
        CONFLICT_LABEL: ${{ inputs.conflict-label }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {run} = require(`${process.env.ACTION_PATH}/rebase.js`);
          await run({github, context, core,
            numbers: process.env.PR_NUMBERS,
            successMessage: process.env.SUCCESS_MESSAGE,
            forkBlockedMessage: process.env.FORK_BLOCKED_MESSAGE,
            mode: process.env.REBASE_CONFLICTS === 'true',
            report: process.env.REPORT_CONFLICTS === 'true',
            commentOnUpdate: process.env.COMMENT_ON_UPDATE !== 'false',
            mergeFallback: process.env.MERGE_FALLBACK === 'true',
            supersedeForks: process.env.SUPERSEDE_FORK_PRS === 'true',
            supersedeUnionPaths: process.env.SUPERSEDE_UNION_PATHS,
            supersedeDraft: process.env.SUPERSEDE_DRAFT !== 'false',
            supersedeSyncMessage: process.env.SUPERSEDE_SYNC_MESSAGE,
            delegateBots: process.env.DELEGATE_BOT_REBASE === 'true',
            resolveDeletedOnMain: process.env.RESOLVE_DELETED_ON_MAIN === 'true',
            resolveDeletedPaths: process.env.RESOLVE_DELETED_PATHS,
            failOnConflict: process.env.FAIL_ON_CONFLICT !== 'false',
            conflictLabel: process.env.CONFLICT_LABEL,
            token: process.env.REBASE_TOKEN});
