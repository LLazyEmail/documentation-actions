name: Auto-rebase open PRs
description: Update selected PR branches, with optional conflict rebase.
inputs:
  github-token:
    description: Token with write access to target branches
    default: ${{ github.token }}
  success-message:
    description: Comment after a successful branch update
    default: '✅ Automatically updated this PR branch with the latest changes from main.'
  fork-blocked-message:
    description: Guidance when fork permissions block updates
    default: 'Enable Allow edits from maintainers or update the fork branch yourself.'
  pr-numbers:
    description: Comma-separated PR numbers; empty selects all open PRs
    default: ''
  rebase-conflicts:
    description: Opt in to git rebase and force-push with lease
    default: 'false'
  report-conflicts:
    description: Without rebase-conflicts, comment conflicting files once per head SHA instead of failing
    default: 'false'
  comment-on-update:
    description: Comment on PRs after a successful branch update
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBERS: ${{ inputs.pr-numbers }}
        REBASE_CONFLICTS: ${{ inputs.rebase-conflicts }}
        SUCCESS_MESSAGE: ${{ inputs.success-message }}
        FORK_BLOCKED_MESSAGE: ${{ inputs.fork-blocked-message }}
        REPORT_CONFLICTS: ${{ inputs.report-conflicts }}
        COMMENT_ON_UPDATE: ${{ inputs.comment-on-update }}
        REBASE_TOKEN: ${{ inputs.github-token }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {run} = require(`${process.env.ACTION_PATH}/rebase.js`);
          await run({github, context, core,
            numbers: process.env.PR_NUMBERS,
            successMessage: process.env.SUCCESS_MESSAGE,
            forkBlockedMessage: process.env.FORK_BLOCKED_MESSAGE,
            mode: process.env.REBASE_CONFLICTS === 'true',
            report: process.env.REPORT_CONFLICTS === 'true',
            commentOnUpdate: process.env.COMMENT_ON_UPDATE !== 'false',
            token: process.env.REBASE_TOKEN});
