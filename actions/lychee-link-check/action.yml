name: Lychee link check
description: >
  Soft-fail lychee link check with a job summary. Optionally open/update an
  issue from the report on schedule or workflow_dispatch.

branding:
  icon: link
  color: purple

inputs:
  args:
    description: Arguments passed to lychee (paths, flags)
    required: true
  fail:
    description: Whether lychee-action should fail the step (default false = soft)
    required: false
    default: 'false'
  output:
    description: Markdown report path
    required: false
    default: lychee-out.md
  create-issue:
    description: 'If true, create/update an issue from the report (for schedule runs)'
    required: false
    default: 'false'
  issue-title:
    description: Issue title when create-issue is true
    required: false
    default: 'Link check report (lychee)'
  issue-labels:
    description: Comma-separated labels for the issue
    required: false
    default: 'maintenance, links'
  github-token:
    description: Token for lychee and optional issue creation
    required: false
    default: ${{ github.token }}
  docusaurus-root:
    description: >
      Optional path relative to the workspace (for example `website`). When
      set, appends --root-dir $GITHUB_WORKSPACE/<value>, --fallback-extensions
      md,mdx, and --index-files index.md,index.mdx,. so Docusaurus
      root-relative and extensionless links resolve to Markdown sources.
      Empty (default) leaves args unchanged.
    required: false
    default: ''
  config-file:
    description: >
      Optional lychee config path. When set and the file exists, prepends
      --config <path>. lychee only auto-loads lychee.toml, so a file named
      .lychee.toml needs this. Empty (default) does not pass --config.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build lychee args
      id: build-args
      shell: bash
      env:
        BASE_ARGS: ${{ inputs.args }}
        CONFIG_FILE: ${{ inputs.config-file }}
        DOCUSAURUS_ROOT: ${{ inputs.docusaurus-root }}
      run: |
        {
          echo "args<<__LYCHEE_ARGS__"
          "$GITHUB_ACTION_PATH/build-args.sh"
          echo "__LYCHEE_ARGS__"
        } >> "$GITHUB_OUTPUT"

    - name: Link check
      id: lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: ${{ steps.build-args.outputs.args }}
        fail: ${{ inputs.fail }}
        format: markdown
        output: ${{ inputs.output }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Write job summary
      if: always()
      shell: bash
      env:
        LYCHEE_OUTPUT: ${{ inputs.output }}
      run: |
        {
          echo "## Lychee link check"
          echo
          if [ -f "$LYCHEE_OUTPUT" ]; then
            cat "$LYCHEE_OUTPUT"
          else
            echo "_No lychee output file produced._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create or update issue from report
      if: always() && inputs.create-issue == 'true'
      continue-on-error: true
      uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
      with:
        title: ${{ inputs.issue-title }}
        content-filepath: ${{ inputs.output }}
        labels: ${{ inputs.issue-labels }}
        issue-number: ''
        token: ${{ inputs.github-token }}
