# Early in-repo auto-rebase so stacked documentation-actions PRs stay current.
# Later replaced by actions/auto-rebase + reusable workflow once that PR merges;
# behaviour of the github-script body stays identical.
name: Auto-rebase open PRs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt to update branches of open PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              if (pr.mergeable_state === 'behind' || pr.mergeable_state === 'dirty' || pr.mergeable_state === 'unknown') {
                try {
                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    expected_head_sha: pr.head.sha
                  });
                  console.log(`Updated branch for PR #${pr.number}`);
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: '✅ Automatically updated this PR branch with the latest changes from main.'
                  });
                } catch (err) {
                  console.log(`Could not update PR #${pr.number}: ${err.message}`);
                  if (err.status === 403) {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: '⚠️ Out of date with main; enable Allow edits from maintainers or rebase.'
                    }).catch(() => {});
                  }
                }
              }
            }
