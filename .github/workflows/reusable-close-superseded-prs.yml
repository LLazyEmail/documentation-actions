name: Reusable close superseded PRs

# Call from a `pull_request_target: types: [closed]` (or `pull_request`) caller.
# Only reads the event payload and the API; never checks out PR code.

on:
  workflow_call:
    # inputs: generated from workflows.manifest.yml and actions/close-superseded/action.yml by scripts/gen-workflows.py
    inputs:
      comment:
        description: 'Comment posted before closing; {merged} is the merged PR number, {author} the closed PR author'
        type: string
        required: false
        default: 'Closed in favour of #{merged}, which superseded this PR and has been merged. Thank you for the contribution, @{author}!'

permissions:
  pull-requests: write

jobs:
  close:
    name: close-superseded
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Close PRs named in "Supersedes #N"'
        uses: LLazyEmail/documentation-actions/actions/close-superseded@main
        with:
          # generated: inputs passed through unchanged (scripts/gen-workflows.py)
          comment: ${{ inputs.comment }}
          # end generated
