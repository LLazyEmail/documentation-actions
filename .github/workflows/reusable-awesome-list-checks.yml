name: Reusable awesome-list checks

on:
  workflow_call:
    # inputs: generated from workflows.manifest.yml and actions/awesome-list-checks/action.yml by scripts/gen-workflows.py
    inputs:
      readme-path:
        description: Path to the curated markdown list
        type: string
        required: false
        default: README.md
      checks:
        description: >
          Comma-separated subset of entry-format, duplicate-links, sorted-sections.
          Default runs all three.
        type: string
        required: false
        default: entry-format,duplicate-links,sorted-sections
      duplicate-mode:
        description: 'fail or warn for duplicate-links (CI historically uses warn)'
        type: string
        required: false
        default: warn
      sorted-mode:
        description: 'warn (default exit 0) or strict (exit 1 on disorder)'
        type: string
        required: false
        default: warn
      entry-format-mode:
        description: 'fail or warn for entry-format hard errors'
        type: string
        required: false
        default: fail
      node-version:
        type: string
        required: false
        default: '20'

jobs:
  awesome-checks:
    name: awesome-list-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Run checks
        uses: LLazyEmail/documentation-actions/actions/awesome-list-checks@main
        with:
          # generated: inputs passed through unchanged (scripts/gen-workflows.py)
          readme-path: ${{ inputs.readme-path }}
          checks: ${{ inputs.checks }}
          duplicate-mode: ${{ inputs.duplicate-mode }}
          sorted-mode: ${{ inputs.sorted-mode }}
          entry-format-mode: ${{ inputs.entry-format-mode }}
          # end generated
