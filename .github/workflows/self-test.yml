name: Self-test actions

# Runs local composite actions against fixtures when those paths exist on the branch.
on:
  pull_request:
    paths:
      - 'actions/**'
      - 'fixtures/**'
      - 'tests/**'
      - '.github/workflows/self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Fixture unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Run unit tests
        run: bash tests/run-unit.sh
