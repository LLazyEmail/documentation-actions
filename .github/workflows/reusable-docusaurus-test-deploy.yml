name: Reusable Docusaurus test-deploy

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: website
      node-version:
        type: string
        required: false
        default: '22'
      cache-dependency-path:
        type: string
        required: false
        default: website/package-lock.json
      install-command:
        type: string
        required: false
        default: npm ci
      build-command:
        type: string
        required: false
        default: npm run build
      prebuild-command:
        type: string
        required: false
        default: ''
      fetch-depth:
        type: number
        required: false
        default: 0
      lfs:
        description: "Pass lfs: true to actions/checkout (Git LFS docs repos)"
        type: boolean
        required: false
        default: false
      annotate-log:
        description: Surface broken-link/warning lines as annotations + job summary
        type: boolean
        required: false
        default: true
      pr-comment:
        description: >
          Upsert a PR comment with build warning/error counts (pull_request only).
          Caller should grant pull-requests: write when enabling.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  test-deploy:
    name: Test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          lfs: ${{ inputs.lfs }}

      - name: Build Docusaurus
        id: build
        uses: LLazyEmail/documentation-actions/actions/docusaurus-build@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}
          build-command: ${{ inputs.build-command }}
          prebuild-command: ${{ inputs.prebuild-command }}
          annotate-log: ${{ inputs.annotate-log && 'true' || 'false' }}

      - name: PR comment with build results
        if: always() && inputs.pr-comment && github.event_name == 'pull_request'
        uses: LLazyEmail/documentation-actions/actions/docusaurus-pr-comment@main
        with:
          warning-count: ${{ steps.build.outputs.warning-count }}
          error-count: ${{ steps.build.outputs.error-count }}
          build-conclusion: ${{ job.status }}
