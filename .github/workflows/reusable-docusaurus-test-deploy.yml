name: Reusable Docusaurus test-deploy

# Compatibility wrapper: preserves the historical workflow_call path for
# callers still pinned to reusable-docusaurus-test-deploy.yml@v1 while the
# real implementation lives under reusable-docs-ci.yml.
# New callers should use reusable-docs-ci.yml directly (run-build: true).

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: website
      node-version:
        type: string
        required: false
        default: '22'
      cache-dependency-path:
        type: string
        required: false
        default: website/package-lock.json
      install-command:
        type: string
        required: false
        default: npm ci
      build-command:
        type: string
        required: false
        default: npm run build
      prebuild-command:
        type: string
        required: false
        default: ''
      fetch-depth:
        description: "Accepted for compatibility; docs-ci always checks out with fetch-depth 0"
        type: number
        required: false
        default: 0
      lfs:
        description: "Pass lfs: true to actions/checkout (Git LFS docs repos)"
        type: boolean
        required: false
        default: false
      annotate-log:
        description: Surface broken-link/warning lines as annotations + job summary
        type: boolean
        required: false
        default: true
      pr-comment:
        description: >
          Upsert a PR comment with build warning/error counts (pull_request only).
          Caller should grant pull-requests: write when enabling.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-deploy:
    uses: ./.github/workflows/reusable-docs-ci.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      cache-dependency-path: ${{ inputs.cache-dependency-path }}
      install-command: ${{ inputs.install-command }}
      build-command: ${{ inputs.build-command }}
      prebuild-command: ${{ inputs.prebuild-command }}
      lfs: ${{ inputs.lfs }}
      run-build: true
      annotate-log: ${{ inputs.annotate-log }}
      pr-comment: ${{ inputs.pr-comment }}
