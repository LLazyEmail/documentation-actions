name: Reusable test-deploy (short name)

# Short-name alias for reusable-docusaurus-test-deploy.yml.
# Prefer this name in new callers.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: website
      node-version:
        type: string
        required: false
        default: '22'
      cache-dependency-path:
        type: string
        required: false
        default: website/package-lock.json
      install-command:
        type: string
        required: false
        default: npm ci
      build-command:
        type: string
        required: false
        default: npm run build
      prebuild-command:
        type: string
        required: false
        default: ''
      fetch-depth:
        type: number
        required: false
        default: 0
      lfs:
        type: boolean
        required: false
        default: false
      annotate-log:
        type: boolean
        required: false
        default: true
      pr-comment:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-deploy:
    uses: ./.github/workflows/reusable-docusaurus-test-deploy.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      cache-dependency-path: ${{ inputs.cache-dependency-path }}
      install-command: ${{ inputs.install-command }}
      build-command: ${{ inputs.build-command }}
      prebuild-command: ${{ inputs.prebuild-command }}
      fetch-depth: ${{ inputs.fetch-depth }}
      lfs: ${{ inputs.lfs }}
      annotate-log: ${{ inputs.annotate-log }}
      pr-comment: ${{ inputs.pr-comment }}
