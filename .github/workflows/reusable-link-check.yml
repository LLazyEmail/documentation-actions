name: Reusable link check

on:
  workflow_call:
    inputs:
      args:
        description: Lychee args including paths
        type: string
        required: true
      create-issue:
        description: Create/update issue from report
        type: boolean
        required: false
        default: false
      docusaurus-root:
        description: >
          Optional path relative to the workspace (for example `website`).
          When set, appends --root-dir $GITHUB_WORKSPACE/<value>,
          --fallback-extensions md,mdx, and --index-files index.md,index.mdx,.
          Empty (default) leaves args unchanged.
        type: string
        required: false
        default: ''
      config-file:
        description: >
          Optional lychee config path. When set and the file exists, pass
          --config <path>. lychee only auto-loads lychee.toml, so a file
          named .lychee.toml needs this. Empty (default) does not pass
          --config.
        type: string
        required: false
        default: ''
      issue-title:
        type: string
        required: false
        default: 'Link check report (lychee)'

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link check
        uses: LLazyEmail/documentation-actions/actions/lychee-link-check@main
        with:
          args: ${{ inputs.args }}
          docusaurus-root: ${{ inputs.docusaurus-root }}
          config-file: ${{ inputs.config-file }}
          create-issue: ${{ inputs.create-issue && 'true' || 'false' }}
          issue-title: ${{ inputs.issue-title }}
