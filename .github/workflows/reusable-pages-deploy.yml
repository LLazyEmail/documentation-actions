name: Reusable pages deploy (short name)

# Generated from workflows.manifest.yml by scripts/gen-workflows.py. Edit the manifest, not this file.
# Short-name alias. Prefer this over reusable-docusaurus-pages-deploy.yml.
# Both names call the same implementation.

on:
  workflow_call:
    # inputs: generated from workflows.manifest.yml and actions/docusaurus-build/action.yml by scripts/gen-workflows.py
    inputs:
      working-directory:
        description: Directory that contains package.json (website or .)
        type: string
        required: false
        default: website
      node-version:
        description: Node.js version (override; default 22)
        type: string
        required: false
        default: '22'
      cache-dependency-path:
        description: Lockfile path for setup-node cache
        type: string
        required: false
        default: website/package-lock.json
      install-command:
        description: Install command
        type: string
        required: false
        default: npm ci
      build-command:
        description: Build command
        type: string
        required: false
        default: npm run build
      artifact-path:
        description: Path passed to upload-pages-artifact
        type: string
        required: false
        default: website/build
      peaceiris-publish-dir:
        type: string
        required: false
        default: ''
      peaceiris-cname:
        type: string
        required: false
        default: ''
      lfs:
        description: "Pass lfs: true to actions/checkout (Git LFS docs repos)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-docusaurus-pages-deploy.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      cache-dependency-path: ${{ inputs.cache-dependency-path }}
      install-command: ${{ inputs.install-command }}
      build-command: ${{ inputs.build-command }}
      artifact-path: ${{ inputs.artifact-path }}
      peaceiris-publish-dir: ${{ inputs.peaceiris-publish-dir }}
      peaceiris-cname: ${{ inputs.peaceiris-cname }}
      lfs: ${{ inputs.lfs }}
    secrets: inherit
