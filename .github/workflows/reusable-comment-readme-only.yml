name: Reusable comment on README-only PRs

on:
  workflow_call:
    inputs:
      docs-prefix:
        description: Path prefix that counts as a docs update
        type: string
        required: false
        default: website/docs/
      comment-body:
        description: Markdown comment (a marker is prepended for idempotency)
        type: string
        required: false
        default: >
          ### Dual-update reminder

          This PR currently only changes `README.md`.

          Please also add the same entry to the matching page under the docs path so the site stays in sync.

          Once the docs file is updated, this reminder can be ignored.

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed files
        id: files
        env:
          DOCS_PREFIX: ${{ inputs.docs-prefix }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          if echo "$CHANGED" | grep -q '^README.md$' \
            && ! echo "$CHANGED" | grep -q "^${DOCS_PREFIX}"; then
            echo "readme_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "readme_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post guidance comment
        if: steps.files.outputs.readme_only == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          COMMENT_BODY: ${{ inputs.comment-body }}
        with:
          script: |
            const marker = '<!-- readme-only-guidance -->';
            const body = marker + '\n' + process.env.COMMENT_BODY;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
