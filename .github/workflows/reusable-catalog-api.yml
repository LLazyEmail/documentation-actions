name: Reusable catalog / JSON API regenerate

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: website
      node-version:
        type: string
        required: false
        default: '20'
      cache-dependency-path:
        type: string
        required: false
        default: website/package-lock.json
      generate-command:
        type: string
        required: true
      commit-paths:
        type: string
        required: true
      commit-message:
        type: string
        required: true
      install:
        description: Run npm ci before generate
        type: boolean
        required: false
        default: false
      concurrency-group:
        type: string
        required: false
        default: catalog-api

permissions:
  contents: write

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

jobs:
  catalog-api:
    name: Regenerate catalog JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.install && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        if: ${{ inputs.install }}
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Generate JSON API
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.generate-command }}

      - name: Commit and push
        uses: LLazyEmail/documentation-actions/actions/git-push-retry@main
        with:
          commit-paths: ${{ inputs.commit-paths }}
          commit-message: ${{ inputs.commit-message }}
          up-to-date-message: Catalog JSON already up to date.
