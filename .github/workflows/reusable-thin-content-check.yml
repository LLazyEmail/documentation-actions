name: Reusable thin content check

on:
  workflow_call:
    inputs:
      build-dir:
        description: Built directory relative to repository root
        type: string
        required: false
        default: 'build'
      base-url:
        description: Site path prefix
        type: string
        required: false
        default: '/'
      working-directory:
        description: Directory containing package.json
        type: string
        required: false
        default: '.'
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '22'
      cache-dependency-path:
        description: Lockfile relative to repository root
        type: string
        required: false
        default: 'package-lock.json'
      install-command:
        description: Dependency installation command
        type: string
        required: false
        default: 'npm ci'
      build-command:
        description: Website build command
        type: string
        required: false
        default: 'npm run build'
      prebuild-command:
        description: Optional command before build
        type: string
        required: false
        default: ''
      lfs:
        description: "Pass lfs: true to actions/checkout (Git LFS docs repos)"
        type: boolean
        required: false
        default: false
      site-url:
        description: Optional site origin (for example https://example.github.io) for full page URLs in the report
        type: string
        required: false
        default: ''
      min-words:
        description: Pages with fewer visible words in the main content are reported
        type: number
        required: false
        default: 150
      allowlist:
        description: Optional repository-relative allowlist (page path, URL path, route or source file per line)
        type: string
        required: false
        default: ''
      mode:
        description: warn or fail
        type: string
        required: false
        default: 'warn'

permissions:
  contents: read

jobs:
  thin-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: ${{ inputs.lfs }}
      - name: Build site
        uses: LLazyEmail/documentation-actions/actions/docusaurus-build@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}
          build-command: ${{ inputs.build-command }}
          prebuild-command: ${{ inputs.prebuild-command }}
      - name: Check page content
        uses: LLazyEmail/documentation-actions/actions/thin-content-check@main
        with:
          build-dir: ${{ inputs.build-dir }}
          base-url: ${{ inputs.base-url }}
          site-url: ${{ inputs.site-url }}
          min-words: ${{ inputs.min-words }}
          allowlist: ${{ inputs.allowlist }}
          mode: ${{ inputs.mode }}
          report-json: thin-content-report.json
          docusaurus-dir: ${{ inputs.working-directory }}/.docusaurus
      - name: Upload page report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thin-content-report
          path: thin-content-report.json
          if-no-files-found: ignore
