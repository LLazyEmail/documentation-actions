name: Reusable docs sync feedback

# Opt-in. Call from a `pull_request_target` caller (plus optional workflow_dispatch)
# so fork PRs get a label and a comment too. Safe with a write token: the job checks
# out the BASE branch only (docs pages are read as text) and reads the PR's files
# through the API. No PR code is checked out or executed.

on:
  workflow_call:
    # inputs: generated from workflows.manifest.yml and actions/docs-sync-feedback/action.yml by scripts/gen-workflows.py
    inputs:
      docs-glob:
        description: Glob for docs files that count as "in sync" (match reusable-readme-sync)
        type: string
        required: false
        default: website/docs/**/*.md
      pass-if-links-in-docs:
        description: Treat added links that already appear on a docs page as in sync (match reusable-readme-sync)
        type: boolean
        required: false
        default: false
      label:
        description: Label added while docs are missing (created if absent); empty disables labelling
        type: string
        required: false
        default: needs-docs-sync
      contributing-url:
        description: Link to the contributing guide; empty auto-detects CONTRIBUTING.md in the base checkout
        type: string
        required: false
        default: ''
      check-name:
        description: Name of the failing check, as shown to the contributor
        type: string
        required: false
        default: README ↔ docs sync
      pr-number:
        description: PR to check on workflow_dispatch; empty uses the event's pull request
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  feedback:
    name: docs-sync-feedback
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Base branch only (the default ref for pull_request_target); never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Label and comment when docs are missing
        uses: LLazyEmail/documentation-actions/actions/docs-sync-feedback@main
        with:
          # generated: inputs passed through unchanged (scripts/gen-workflows.py)
          docs-glob: ${{ inputs.docs-glob }}
          pass-if-links-in-docs: ${{ inputs.pass-if-links-in-docs }}
          label: ${{ inputs.label }}
          contributing-url: ${{ inputs.contributing-url }}
          check-name: ${{ inputs.check-name }}
          pr-number: ${{ inputs.pr-number }}
          # end generated
