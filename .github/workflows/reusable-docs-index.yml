name: Reusable docs pages index

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: website
      node-version:
        type: string
        required: false
        default: ''
      cache-dependency-path:
        type: string
        required: false
        default: website/package-lock.json
      generate-command:
        type: string
        required: false
        default: npm run generate:docs-index
      commit-paths:
        type: string
        required: false
        default: website/docs/pages-index.md
      commit-message:
        type: string
        required: false
        default: 'chore(docs-index): regenerate all-pages markdown list'
      skip-install:
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: docs-index
  cancel-in-progress: false

jobs:
  docs-index:
    name: Regenerate docs pages index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version != '' && inputs.node-version || '' }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        if: ${{ !inputs.skip-install }}
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Generate docs pages index
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.generate-command }}

      - name: Commit and push index
        env:
          COMMIT_PATHS: ${{ inputs.commit-paths }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $COMMIT_PATHS
          if git diff --staged --quiet; then
            echo "Docs pages index already up to date."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          # Concurrent consumer pushes can race; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "push failed after retries" >&2
          exit 1
