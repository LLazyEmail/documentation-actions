# DEPRECATED: Prefer reusable-readme-sync.yml.
# This name remains supported on v1 and will be removed in v3.
name: Reusable README ↔ docs sync check

on:
  workflow_call:
    inputs:
      docs-glob:
        description: Glob for docs files that count as "in sync"
        type: string
        required: false
        default: website/docs/**/*.md
      comment-body:
        description: Markdown comment posted when README changes without docs
        type: string
        required: false
        default: >
          ### Docs sync check

          This PR updates `README.md` but does not touch any file under the docs path.

          Please also update the matching documentation page so the published site stays in sync.

          After adding the docs change, this check will pass.
      fail-on-missing:
        description: Fail the job when docs are missing (otherwise only comment)
        type: boolean
        required: false
        default: true
      post-comment:
        description: >-
          Post comment-body when docs are missing. Set false when
          reusable-sync-feedback.yml handles the comment (and label).
        type: boolean
        required: false
        default: true
      pass-if-links-in-docs:
        description: >-
          Opt-in. Pass a README-only PR when every link it adds to README.md
          already appears in a docs file matching docs-glob, or when it adds
          no links at all (prose or table edits). Off by default.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect README-only changes
        id: check
        env:
          DOCS_GLOB: ${{ inputs.docs-glob }}
          LINKS_IN_DOCS: ${{ inputs.pass-if-links-in-docs }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          README_CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -c '^README.md$' || true)
          # shellcheck disable=SC2016
          DOCS_CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -cE "^${DOCS_GLOB//\*\*/.*}" || true)

          echo "readme_changed=$README_CHANGED" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$DOCS_CHANGED" >> "$GITHUB_OUTPUT"

          MISSING=false
          if [ "$README_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
            MISSING=true
            if [ "$LINKS_IN_DOCS" = "true" ]; then
              # Links on lines this PR adds to README.md
              LINKS=$(git diff -U0 "$BASE" "$HEAD" -- README.md \
                | grep -E '^\+[^+]' \
                | grep -oE 'https?://[^) >"]+' | sort -u || true)
              DOCS_DIR="${DOCS_GLOB%%\**}"
              DOCS_DIR="${DOCS_DIR:-.}"
              if [ -n "$LINKS" ]; then
                ALL_FOUND=true
                while IFS= read -r url; do
                  if git grep -qF "$url" "$HEAD" -- ":(glob)$DOCS_GLOB" 2>/dev/null; then
                    echo "Already in docs: $url"
                  else
                    echo "Not in docs: $url"
                    ALL_FOUND=false
                  fi
                done <<< "$LINKS"
                if [ "$ALL_FOUND" = "true" ]; then
                  echo "Every link added to README.md is already in $DOCS_DIR; docs are in sync."
                  MISSING=false
                fi
              else
                # Prose/table-only README edit: no new links, nothing to mirror.
                echo "No links added to README.md; nothing to sync to $DOCS_DIR."
                MISSING=false
              fi
            fi
          fi
          echo "missing_docs=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Comment if docs page missing
        if: steps.check.outputs.missing_docs == 'true' && inputs.post-comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COMMENT_BODY: ${{ inputs.comment-body }}
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: process.env.COMMENT_BODY
              });
            } catch (err) {
              // PRs from forks get a read-only token; the next step still fails the check.
              if (err.status !== 403) throw err;
              core.warning('Could not comment (read-only token on a fork PR); see the job summary.');
              await core.summary.addRaw(process.env.COMMENT_BODY).write();
            }

      - name: Fail if docs missing
        if: steps.check.outputs.missing_docs == 'true' && inputs.fail-on-missing
        run: |
          echo "::error::README.md changed but no matching docs file was updated."
          exit 1
