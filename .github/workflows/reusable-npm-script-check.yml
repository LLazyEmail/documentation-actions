name: Reusable npm script check

on:
  workflow_call:
    # inputs: generated from workflows.manifest.yml and actions/npm-script-check/action.yml by scripts/gen-workflows.py
    inputs:
      working-directory:
        description: Directory that contains package.json
        type: string
        required: false
        default: '.'
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '22'
      cache-dependency-path:
        description: Lockfile path for setup-node cache
        type: string
        required: false
        default: package-lock.json
      install-command:
        description: Install command (empty skips install)
        type: string
        required: false
        default: npm ci
      package-manager-cache:
        description: setup-node cache value (npm, yarn, pnpm) or empty to disable
        type: string
        required: false
        default: npm
      run-command:
        description: Command to run after install (required)
        type: string
        required: true
      fetch-depth:
        type: number
        required: false
        default: 0
      lfs:
        description: "Pass lfs: true to actions/checkout (Git LFS repos)"
        type: boolean
        required: false
        default: false
      job-name:
        type: string
        required: false
        default: npm script check

jobs:
  npm-script-check:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          lfs: ${{ inputs.lfs }}

      - name: Run npm script check
        uses: LLazyEmail/documentation-actions/actions/npm-script-check@main
        with:
          # generated: inputs passed through unchanged (scripts/gen-workflows.py)
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}
          package-manager-cache: ${{ inputs.package-manager-cache }}
          run-command: ${{ inputs.run-command }}
          # end generated
