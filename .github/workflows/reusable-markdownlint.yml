name: Reusable markdownlint

on:
  workflow_call:
    inputs:
      globs:
        description: Multiline globs for markdownlint-cli2
        type: string
        required: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint markdown
        uses: LLazyEmail/documentation-actions/actions/markdownlint@main
        with:
          globs: ${{ inputs.globs }}
