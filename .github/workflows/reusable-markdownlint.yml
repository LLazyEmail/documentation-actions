name: Reusable markdownlint

on:
  workflow_call:
    # inputs: generated from workflows.manifest.yml and actions/markdownlint/action.yml by scripts/gen-workflows.py
    inputs:
      globs:
        description: Multiline globs passed to markdownlint-cli2-action
        type: string
        required: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint markdown
        uses: LLazyEmail/documentation-actions/actions/markdownlint@main
        with:
          # generated: inputs passed through unchanged (scripts/gen-workflows.py)
          globs: ${{ inputs.globs }}
          # end generated
