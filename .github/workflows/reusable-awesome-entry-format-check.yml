name: Reusable awesome list entry format check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Basic entry format validation
        run: |
          set -euo pipefail
          echo "Checking list entry style in changed markdown files..."

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE" "$HEAD" | grep -E '\.md$' || true)

          if [ -z "$FILES" ]; then
            echo "No markdown files changed"
            exit 0
          fi

          ERRORS=0
          for f in $FILES; do
            if [ ! -f "$f" ]; then continue; fi
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\s*[-*]\s+\[.*\]\(https?://'; then
                if ! echo "$line" | grep -q ' - '; then
                  echo "::warning file=$f::List entry may be missing ' - description': $line"
                  ERRORS=$((ERRORS+1))
                fi
              fi
            done < "$f"
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::notice::Found $ERRORS potential format issues (warnings only)"
          else
            echo "Entry format looks OK"
          fi
