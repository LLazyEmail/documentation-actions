name: Reusable auto-rebase PRs

on:
  workflow_call:
    inputs:
      pr-numbers:
        description: Comma-separated PR numbers; empty selects all open PRs
        type: string
        default: ''
      rebase-conflicts:
        description: Opt in to git rebase for conflicting PRs
        type: boolean
        default: false
      report-conflicts:
        description: Without rebase-conflicts, comment conflicting files once per head SHA instead of failing
        type: boolean
        default: false
      comment-on-update:
        description: Comment on PRs after a successful branch update
        type: boolean
        default: true
    secrets:
      AUTO_REBASE_TOKEN:
        description: Optional PAT/App token so updated branches re-trigger CI (GITHUB_TOKEN pushes do not)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    name: auto-rebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-rebase-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Attempt to update branches of open PRs
        uses: LLazyEmail/documentation-actions/actions/auto-rebase@main
        with:
          pr-numbers: ${{ inputs.pr-numbers }}
          rebase-conflicts: ${{ inputs.rebase-conflicts }}
          report-conflicts: ${{ inputs.report-conflicts }}
          comment-on-update: ${{ inputs.comment-on-update }}
          github-token: ${{ secrets.AUTO_REBASE_TOKEN || github.token }}
