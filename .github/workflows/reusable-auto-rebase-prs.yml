name: Reusable auto-rebase PRs

on:
  workflow_call:
    inputs:
      pr-numbers:
        description: Comma-separated PR numbers; empty selects all open PRs
        type: string
        default: ''
      rebase-conflicts:
        description: Opt in to git rebase for conflicting PRs
        type: boolean
        default: false
      report-conflicts:
        description: Without rebase-conflicts, comment conflicting files once per head SHA instead of failing
        type: boolean
        default: false
      comment-on-update:
        description: Comment on PRs after a successful branch update
        type: boolean
        default: true
      merge-fallback:
        description: With rebase-conflicts, merge-update (no force-push) when the rebase conflicts but GitHub says mergeable
        type: boolean
        default: false
      supersede-fork-prs:
        description: 'Opt in. Replay conflicting or non-updatable fork PRs into supersede/pr-N and open a PR starting with "Supersedes #N"'
        type: boolean
        default: false
      supersede-union-paths:
        description: Globs where addition-only conflicts keep both sides (e.g. README.md website/docs/**/*.md)
        type: string
        default: ''
      supersede-draft:
        description: Open supersede PRs as drafts
        type: boolean
        default: true
      delegate-bot-rebase:
        description: 'Opt in. Ask Renovate/Dependabot to rebase their own behind or conflicting PRs instead of updating the branch'
        type: boolean
        default: false
    secrets:
      AUTO_REBASE_TOKEN:
        description: Optional PAT/App token so updated branches re-trigger CI (GITHUB_TOKEN pushes do not)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    name: auto-rebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-rebase-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Attempt to update branches of open PRs
        uses: LLazyEmail/documentation-actions/actions/auto-rebase@main
        with:
          pr-numbers: ${{ inputs.pr-numbers }}
          rebase-conflicts: ${{ inputs.rebase-conflicts }}
          report-conflicts: ${{ inputs.report-conflicts }}
          comment-on-update: ${{ inputs.comment-on-update }}
          merge-fallback: ${{ inputs.merge-fallback }}
          supersede-fork-prs: ${{ inputs.supersede-fork-prs }}
          supersede-union-paths: ${{ inputs.supersede-union-paths }}
          supersede-draft: ${{ inputs.supersede-draft }}
          delegate-bot-rebase: ${{ inputs.delegate-bot-rebase }}
          github-token: ${{ secrets.AUTO_REBASE_TOKEN || github.token }}
