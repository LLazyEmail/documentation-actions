name: Reusable open PRs status report

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate open PR summary issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });

            const lines = [
              '| PR | Title | Author | Mergeable | Updated |',
              '|---|---|---|---|---|'
            ];
            for (const pr of prs) {
              const { data: full } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              const state = full.mergeable_state || 'unknown';
              const updated = full.updated_at.slice(0, 10);
              const title = pr.title.replace(/\|/g, '\\|');
              const link = `[#${pr.number}](${pr.html_url})`;
              lines.push(
                `| ${link} | ${title} | @${pr.user.login} | \`${state}\` | ${updated} |`
              );
            }

            const header = '## Open pull requests status\n\n';
            const intro = 'Auto-generated report of open PRs (oldest first).\n\n';
            const footer = '\n_Generated by the reusable-pr-status-report workflow._';
            const body = header + intro + lines.join('\n') + footer;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pr-status-report',
              per_page: 1
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Open PRs status report',
                body,
                labels: ['pr-status-report']
              });
              console.log('Created new status issue');
            }
