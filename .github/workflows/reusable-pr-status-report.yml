name: Reusable open PRs status report

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate open PR summary issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });

            let rows = '| PR | Title | Author | Mergeable | Updated |\n|---|---|---|---|---|\n';
            for (const pr of prs) {
              const { data: full } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              const state = full.mergeable_state || 'unknown';
              const updated = full.updated_at.slice(0, 10);
              rows += `| [#${pr.number}](${pr.html_url}) | ${pr.title.replace(/\|/g, '\\|')} | @${pr.user.login} | \`${state}\` | ${updated} |\n`;
            }

            const body = `## Open pull requests status

Auto-generated report of open PRs (oldest first).

${rows}

_Generated by the reusable-pr-status-report workflow._`;

            const { data: issues } = await github.rest.issues.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pr-status-report',
              per_page: 1
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Open PRs status report',
                body,
                labels: ['pr-status-report']
              });
              console.log('Created new status issue');
            }
